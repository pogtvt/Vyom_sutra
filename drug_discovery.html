<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vyom Sutra | Clinical Intelligence Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#030712] text-slate-100 font-sans antialiased min-h-screen selection:bg-cyan-500 selection:text-black">
    <!-- Header -->
    <header class="border-b border-cyan-500/20 bg-[#030712]/95 backdrop-blur-2xl sticky top-0 z-50 shadow-[0_4px_30px_rgba(0,0,0,0.8)]">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center space-x-3">
                <div class="w-4 h-4 bg-cyan-400 rounded-full shadow-[0_0_20px_#22d3ee] animate-pulse"></div>
                <h1 class="text-lg sm:text-xl font-black tracking-wider text-white">VYOM SUTRA <span class="text-cyan-400 text-[10px] font-bold uppercase tracking-widest bg-cyan-500/10 border border-cyan-500/30 px-2 py-0.5 rounded-md ml-1">Clinical Engine</span></h1>
            </div>
            <div id="record-count" class="text-xs font-semibold bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 px-3 py-1.5 rounded-xl shadow-[0_0_10px_rgba(16,185,129,0.2)]">
                Syncing Records...
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-6 sm:py-10">
        <div class="mb-8 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <h2 class="text-2xl sm:text-3xl font-black tracking-tight text-white mb-2">Comprehensive Compound Pipeline Cards</h2>
                <p class="text-slate-400 text-xs sm:text-sm">Structured clinical records highlighting prominent target proteins, affinity metrics, and complete mechanistic pathways.</p>
            </div>
            <div class="bg-slate-900 border border-cyan-500/30 px-4 py-2 rounded-xl text-xs font-mono text-cyan-300">
                Pipeline Status: <span class="text-emerald-400 font-bold">ONLINE</span>
            </div>
        </div>

        <!-- Dynamic Card Grid Container -->
        <div id="cards-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="col-span-full p-12 text-center text-cyan-400 animate-pulse font-mono text-sm">Loading rich clinical card records...</div>
        </div>
    </main>

    <script>
        async function loadDiscoveries() {
            try {
                const response = await fetch('discoveries.json?v=' + new Date().getTime(), { cache: 'no-store' });
                const data = await response.json();
                
                document.getElementById('record-count').innerText = `${data.length} Permanent Records`;
                
                const container = document.getElementById('cards-container');
                container.innerHTML = '';

                data.forEach(item => {
                    const isComm = item.type && item.type.includes('Commercial');
                    const mechText = item.mechanism || "Engineered via 256-bit cosmic harmonic field equations, deploying advanced receptor blockade and targeted molecular binding to achieve therapeutic efficacy.";
                    const statusText = item.status || "Active Clinical Pipeline Standard";
                    const indText = item.indication || item.target_protein || "Advanced oncological and systemic target modulation.";

                    const card = document.createElement('div');
                    card.className = "bg-slate-900/90 border border-cyan-500/40 rounded-2xl p-5 sm:p-7 shadow-[0_0_35px_rgba(34,211,238,0.06)] backdrop-blur-xl hover:border-cyan-400 transition-all flex flex-col justify-between";
                    
                    card.innerHTML = `
                        <div>
                            <!-- Header Row -->
                            <div class="flex justify-between items-start gap-3 mb-4 pb-3 border-b border-slate-800">
                                <div>
                                    <span class="${isComm ? 'bg-purple-500/10 text-purple-400 border-purple-500/30' : 'bg-cyan-500/10 text-cyan-400 border-cyan-500/30'} border px-3 py-1 rounded-lg text-[10px] font-bold shadow-sm inline-block mb-2">${item.type || 'Clinical Standard'}</span>
                                    <h3 class="text-xl font-black text-cyan-300 tracking-wide">${item.name}</h3>
                                </div>
                                <span class="${isComm ? 'bg-blue-500/10 text-blue-400 border-blue-500/30' : 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30'} border px-3 py-1 rounded-full text-xs font-black shadow-sm shrink-0">${item.resonance || '100.0%'} Match</span>
                            </div>
                            
                            <!-- Target Protein Box (Prominent & Bold) -->
                            <div class="bg-cyan-950/40 p-4 rounded-xl border border-cyan-500/30 mb-3 shadow-[0_0_15px_rgba(34,211,238,0.05)]">
                                <span class="text-[10px] font-extrabold uppercase tracking-widest text-cyan-400 block mb-1">Target Protein:</span>
                                <strong class="text-white text-sm sm:text-base font-mono font-black tracking-wide block">${item.target_protein || 'Cosmic-Core'}</strong>
                            </div>

                            <!-- Clinical Indication Box -->
                            <div class="bg-slate-950/80 p-3.5 rounded-xl border border-slate-800 mb-3">
                                <span class="text-[10px] font-extrabold uppercase tracking-widest text-emerald-400 block mb-1">Clinical Indication:</span>
                                <p class="text-xs text-slate-200">${indText}</p>
                            </div>

                            <!-- Mechanism of Action Box -->
                            <div class="bg-slate-950/80 p-4 rounded-xl border border-slate-800 mb-4">
                                <h4 class="text-[11px] font-extrabold uppercase tracking-widest text-cyan-400 mb-2 flex items-center gap-2">
                                    <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span> Clinical Passage & Mechanism:
                                </h4>
                                <p class="text-xs sm:text-sm text-slate-200 leading-relaxed text-justify">${mechText}</p>
                            </div>

                            <!-- Scientific Metrics Grid -->
                            <div class="grid grid-cols-3 gap-2 font-mono text-xs mb-4">
                                <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800 text-center">
                                    <span class="text-slate-500 block text-[9px] uppercase">Binding Affinity</span>
                                    <strong class="text-emerald-400 text-xs">${item.binding_affinity || '-10.5 kcal/mol'}</strong>
                                </div>
                                <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800 text-center">
                                    <span class="text-slate-500 block text-[9px] uppercase">Phase Angle</span>
                                    <strong class="text-amber-400 text-xs">${item.phase || '0.12 rad'}</strong>
                                </div>
                                <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800 text-center">
                                    <span class="text-slate-500 block text-[9px] uppercase">Lab SA Score</span>
                                    <strong class="text-purple-400 text-xs">${item.sa_score || '10.0/10'}</strong>
                                </div>
                            </div>
                        </div>

                        <!-- Footer Metadata -->
                        <div class="flex justify-between items-center text-[10px] text-slate-500 font-mono pt-3 border-t border-slate-800/80">
                            <span>Mode: ${item.mode || 'Harmonic Core'}</span>
                            <span>${item.timestamp || 'Live'}</span>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error("Error loading discoveries cards:", err);
            }
        }

        loadDiscoveries();
        setInterval(loadDiscoveries, 10000);
    </script>
</body>
</html>
