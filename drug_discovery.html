                <p class="text-slate-400 text-xs sm:text-sm">Real biological targets spanning congenital disorders, metabolic pathways, oncology, and neurodegeneration.</p>
            </div>
            <div class="w-full sm:w-80">
                <input type="text" id="searchInput" placeholder="Search disease, target, compound..." onkeyup="filterDiscoveries()" class="w-full bg-slate-900 border border-cyan-500/30 rounded-xl px-4 py-3 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-400 shadow-inner font-mono">
            </div>
        </div>

        <!-- Dynamic Card Grid Container -->
        <div id="cards-container" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </main>

            // 4. Neurological & Neurodegenerative

        let currentFiltered = universalTargetsDataset;
        let displayedCount = 6;

        function loadDiscoveries() {
            currentFiltered = universalTargetsDataset;
            document.getElementById('record-count').innerText = `${universalTargetsDataset.length} Universal Disease Targets`;
            renderCards();
        }

        function exportUniversalJSON() {
            const statusEl = document.getElementById('record-count');
            statusEl.innerText = "Exporting dataset...";
            setTimeout(() => {
                const jsonString = JSON.stringify(universalTargetsDataset, null, 4);
                const blob = new Blob([jsonString], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const downloadAnchor = document.createElement('a');
                downloadAnchor.href = url;
                downloadAnchor.download = "universal_disease_targets.json";
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
                URL.revokeObjectURL(url);
                statusEl.innerText = `${universalTargetsDataset.length} Records (Exported!)`;
            }, 100);
        }

        function renderCards() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';
            const itemsToDisplay = currentFiltered.slice(0, displayedCount);

            if (itemsToDisplay.length === 0) {
                container.innerHTML = `<div class="col-span-full p-12 text-center text-slate-500 font-mono text-sm">No matching disease targets found.</div>`;
                return;
            }

            itemsToDisplay.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-slate-900/90 border border-cyan-500/40 rounded-2xl p-5 sm:p-7 shadow-lg backdrop-blur-xl hover:border-cyan-400 transition-all flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start gap-3 mb-4 pb-3 border-b border-slate-800">
                            <div>
                                <span class="bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 px-3 py-1 rounded-lg text-[10px] font-bold inline-block mb-2">${item.category}</span>
                                <h3 class="text-xl font-black text-cyan-300 tracking-wide">${item.disease}</h3>
                            </div>
                            <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded-full text-xs font-black shrink-0">${item.resonance} Match</span>
                        </div>
                        <div class="bg-cyan-950/40 p-4 rounded-xl border border-cyan-500/30 mb-3">
                            <span class="text-[10px] font-extrabold uppercase tracking-widest text-cyan-400 block mb-1">True Biological Target Protein:</span>
                            <strong class="text-white text-sm font-mono block">${item.target_protein}</strong>
                        </div>
                        <div class="bg-slate-950/80 p-3.5 rounded-xl border border-slate-800 mb-3">
                            <span class="text-[10px] font-extrabold uppercase tracking-widest text-emerald-400 block mb-1">Candidate Compound / Modulator:</span>
                            <strong class="text-slate-200 text-xs font-mono block">${item.compound}</strong>
                        </div>
                        <div class="bg-slate-950/80 p-4 rounded-xl border border-slate-800 mb-4">
                            <h4 class="text-[11px] font-extrabold uppercase tracking-widest text-cyan-400 mb-2">Molecular Mechanism of Action:</h4>
                            <p class="text-xs sm:text-sm text-slate-200 leading-relaxed">${item.mechanism}</p>
                        </div>
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 font-mono text-xs mb-4">
                            <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800 text-center">
                                <span class="text-slate-500 block text-[9px] uppercase">Mol Wt</span>
                                <strong class="text-cyan-300 text-[11px]">${item.mw} g/mol</strong>
                            </div>
                            <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800 text-center">
                                <span class="text-slate-500 block text-[9px] uppercase">LogP</span>
                                <strong class="text-blue-400 text-[11px]">${item.logp}</strong>
                            </div>
                            <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800 text-center">
                                <span class="text-slate-500 block text-[9px] uppercase">Phase ($\theta$)</span>
                                <strong class="text-amber-400 text-[11px]">${item.phase}</strong>
                            </div>
                            <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800 text-center">
                                <span class="text-slate-500 block text-[9px] uppercase">Tensor ($C_{\mu\nu}$)</span>
                                <strong class="text-purple-400 text-[11px]">${item.c_mu_nu}</strong>
                            </div>
                        </div>
                    </div>
                    <div class="flex justify-between items-center text-[10px] text-slate-500 font-mono pt-3 border-t border-slate-800">
                        <span>Status: ${item.status}</span>
                        <span>Vyom Sutra Engine</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterDiscoveries() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            currentFiltered = universalTargetsDataset.filter(item => {
                return (item.disease && item.disease.toLowerCase().includes(query)) ||
                       (item.category && item.category.toLowerCase().includes(query)) ||
                       (item.target_protein && item.target_protein.toLowerCase().includes(query)) ||
                       (item.compound && item.compound.toLowerCase().includes(query));
            });
            displayedCount = 6;
            renderCards();
        }

        loadDiscoveries();
    </script>
</body>
</html>
