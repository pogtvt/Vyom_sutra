name: Vyom Autonomous Hyper-Engine

on:
  schedule:
    - cron: '*/5 * * * *'  # हरेक ५-५ मिनेटमा GitHub क्लाउडमा आफैँ चल्ने
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Vyom Hyper-Engine
        run: |
          python run_engine.py

      - name: Commit and Push Discoveries
        run: |
          git config --global user.name "Vyom-Autonomous-Bot"
          git config --global user.email "bot@vyom.sutra"
          git add discoveries.json
          git diff --staged --quiet || git commit -m "Cloud Autonomous Discovery: Peak Hyper-Scale [skip ci]"
          git push
