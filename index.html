<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vyom Sutra | Clinical Intelligence Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#030712] text-slate-100 font-sans antialiased min-h-screen selection:bg-cyan-500 selection:text-black">
    <!-- Header -->
    <header class="border-b border-cyan-500/20 bg-[#030712]/95 backdrop-blur-2xl sticky top-0 z-50 shadow-[0_4px_30px_rgba(0,0,0,0.8)]">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center space-x-3">
                <div class="w-3 h-3 bg-cyan-400 rounded-full shadow-[0_0_15px_#22d3ee] animate-pulse"></div>
                <h1 class="text-lg sm:text-xl font-black tracking-wider text-white">VYOM SUTRA <span class="text-cyan-400 text-[10px] font-bold uppercase tracking-widest bg-cyan-500/10 border border-cyan-500/30 px-2 py-0.5 rounded-md ml-1">Clinical Engine v4.4 (Persistent & Export)</span></h1>
            </div>
            <div class="flex items-center gap-2 flex-wrap justify-center">
                <button onclick="openThetaModal()" class="bg-cyan-500/20 hover:bg-cyan-500/30 border border-cyan-400/50 text-cyan-300 font-mono text-xs px-3 py-2 rounded-xl transition-all flex items-center gap-1.5">
                    <span>⚡</span> Theta Gen
                </button>
                <button onclick="exportJSONFile()" class="bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-400/50 text-emerald-300 font-mono text-xs px-3 py-2 rounded-xl transition-all flex items-center gap-1.5 shadow-[0_0_15px_rgba(16,185,129,0.2)]">
                    <span>💾</span> Export JSON for Git
                </button>
                <div id="record-count" class="text-xs font-semibold bg-slate-900 border border-slate-800 text-cyan-400 px-3 py-2 rounded-xl font-mono">
                    Loading...
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-6 sm:py-10">
        <div class="mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <h2 class="text-2xl sm:text-3xl font-black tracking-tight text-white mb-2">Comprehensive Compound Pipeline</h2>
                <p class="text-slate-400 text-xs sm:text-sm">Persistent local auto-synthesis daemon (Capped at 50 compounds).</p>
            </div>
            <div class="w-full sm:w-80">
                <input type="text" id="searchInput" placeholder="Search name, protein, weight, affinity..." onkeyup="filterDiscoveries()" class="w-full bg-slate-900 border border-cyan-500/30 rounded-xl px-4 py-3 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-400 shadow-inner font-mono">
            </div>
        </div>

        <!-- Dynamic Card Grid Container -->
        <div id="cards-container" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>

        <!-- Loading indicator for infinite scroll -->
        <div id="load-more-indicator" class="text-center py-8 text-xs font-mono text-cyan-400 hidden">
            Scroll down to load more clinical records...
        </div>
    </main>

    <!-- Theta Value Compound Generator Modal Box -->
    <div id="thetaModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-cyan-500/50 rounded-3xl p-6 sm:p-8 max-w-lg w-full shadow-[0_0_50px_rgba(34,211,238,0.3)]">
            <div class="flex justify-between items-center mb-5 pb-3 border-b border-slate-800">
                <h3 class="text-lg font-black text-white">Generate Compound via Theta Value</h3>
                <button onclick="closeThetaModal()" class="text-slate-400 hover:text-white font-mono text-sm px-2.5 py-1 bg-slate-800 rounded-lg">✕</button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-[10px] font-extrabold uppercase tracking-widest text-cyan-400 mb-2">Theta Phase Value:</label>
                    <input type="text" id="thetaInput" placeholder="Enter theta value (e.g. 0.15)..." class="w-full bg-slate-950 border border-cyan-500/40 rounded-xl px-4 py-3 text-xs text-cyan-200 placeholder-slate-600 focus:outline-none focus:border-cyan-400 font-mono">
                </div>
                <div class="flex gap-3 pt-2">
                    <button onclick="executeThetaSynthesis()" class="flex-1 bg-cyan-500 hover:bg-cyan-400 text-black font-black text-xs py-3 rounded-xl transition-all">Synthesize & Save Locally</button>
                    <button onclick="closeThetaModal()" class="bg-slate-800 text-slate-300 font-bold text-xs px-5 py-3 rounded-xl">Cancel</button>
                </div>
            </div>
            <div id="theta-result-summary" class="mt-5 text-xs font-mono text-emerald-400 text-center hidden"></div>
        </div>
    </div>

    <script>
        let allDiscoveries = [];
        let displayedCount = 6;
        let currentFiltered = [];

        async function loadDiscoveries() {
            const savedData = localStorage.getItem('vyom_persistent_discoveries');
            if (savedData) {
                try {
                    allDiscoveries = JSON.parse(savedData);
                } catch (e) {
                    allDiscoveries = [];
                }
            }

            if (!Array.isArray(allDiscoveries) || allDiscoveries.length === 0) {
                try {
                    const response = await fetch('discoveries.json?v=' + new Date().getTime(), { cache: 'no-store' });
                    if (!response.ok) throw new Error("File not found");
                    allDiscoveries = await response.json();
                } catch (err) {
                    allDiscoveries = [];
                }
            }
            
            if (!Array.isArray(allDiscoveries) || allDiscoveries.length === 0) {
                allDiscoveries = [{
                    name: "Aspirin Advanced",
                    type: "Clinical Standard",
                    resonance: "99.8%",
                    target_protein: "COX-1 / COX-2 Prostaglandin Synthase",
                    indication: "Anti-inflammatory, analgesic, and cardiovascular thrombosis prevention.",
                    mechanism: "Irreversible inhibition of cyclooxygenase enzymes via targeted acetyl group transfer.",
                    mw: "180.16",
                    logp: "1.19",
                    binding_affinity: "-9.2 kcal/mol",
                    phase: "0.12 rad",
                    sa_score: "2.1/10",
                    mode: "Harmonic Core",
                    timestamp: "Live Sync"
                }];
            }

            saveToLocalStorage();
            currentFiltered = allDiscoveries;
            document.getElementById('record-count').innerText = `${allDiscoveries.length} Records (Saved)`;
            renderCards();
        }

        function saveToLocalStorage() {
            localStorage.setItem('vyom_persistent_discoveries', JSON.stringify(allDiscoveries));
        }

        function exportJSONFile() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(allDiscoveries, null, 4));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "discoveries.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function renderCards() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';
            const itemsToDisplay = currentFiltered.slice(0, displayedCount);

            if (itemsToDisplay.length === 0) {
                container.innerHTML = `<div class="col-span-full p-12 text-center text-slate-500 font-mono text-sm">No matching clinical records found.</div>`;
                document.getElementById('load-more-indicator').classList.add('hidden');
                return;
            }

            itemsToDisplay.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-slate-900/90 border border-cyan-500/40 rounded-2xl p-5 sm:p-7 shadow-lg backdrop-blur-xl hover:border-cyan-400 transition-all flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start gap-3 mb-4 pb-3 border-b border-slate-800">
                            <div>
                                <span class="bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 px-3 py-1 rounded-lg text-[10px] font-bold inline-block mb-2">${item.type || 'Clinical Standard'}</span>
                                <h3 class="text-xl font-black text-cyan-300 tracking-wide">${item.name}</h3>
                            </div>
                            <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded-full text-xs font-black shrink-0">${item.resonance || '100.0%'} Match</span>
                        </div>
                        <div class="bg-cyan-950/40 p-4 rounded-xl border border-cyan-500/30 mb-3">
                            <span class="text-[10px] font-extrabold uppercase tracking-widest text-cyan-400 block mb-1">Target Protein:</span>
                            <strong class="text-white text-sm font-mono block">${item.target_protein || 'Cosmic-Core'}</strong>
                        </div>
                        <div class="bg-slate-950/80 p-3.5 rounded-xl border border-slate-800 mb-3">
                            <span class="text-[10px] font-extrabold uppercase tracking-widest text-emerald-400 block mb-1">Clinical Indication:</span>
                            <p class="text-xs text-slate-200">${item.indication || item.target_protein}</p>
                        </div>
                        <div class="bg-slate-950/80 p-4 rounded-xl border border-slate-800 mb-4">
                            <h4 class="text-[11px] font-extrabold uppercase tracking-widest text-cyan-400 mb-2">Mechanistic Action:</h4>
                            <p class="text-xs sm:text-sm text-slate-200 leading-relaxed">${item.mechanism || "Engineered via harmonic field equations."}</p>
                        </div>
                        <div class="grid grid-cols-2 sm:grid-cols-5 gap-2 font-mono text-xs mb-4">
                            <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800 text-center">
                                <span class="text-slate-500 block text-[9px] uppercase">Molecular Wt</span>
                                <strong class="text-cyan-300 text-[11px]">${item.mw || '450.2'} g/mol</strong>
                            </div>
                            <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800 text-center">
                                <span class="text-slate-500 block text-[9px] uppercase">LogP</span>
                                <strong class="text-blue-400 text-[11px]">${item.logp || '2.85'}</strong>
                            </div>
                            <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800 text-center">
                                <span class="text-slate-500 block text-[9px] uppercase">Binding Aff.</span>
                                <strong class="text-emerald-400 text-[11px]">${item.binding_affinity || '-10.5 kcal/mol'}</strong>
                            </div>
                            <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800 text-center">
                                <span class="text-slate-500 block text-[9px] uppercase">Theta Phase</span>
                                <strong class="text-amber-400 text-[11px]">${item.phase || '0.12 rad'}</strong>
                            </div>
                            <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800 text-center col-span-2 sm:col-span-1">
                                <span class="text-slate-500 block text-[9px] uppercase">SA Score</span>
                                <strong class="text-purple-400 text-[11px]">${item.sa_score || '10.0/10'}</strong>
                            </div>
                        </div>
                    </div>
                    <div class="flex justify-between items-center text-[10px] text-slate-500 font-mono pt-3 border-t border-slate-800">
                        <span>Mode: ${item.mode || 'Harmonic Core'}</span>
                        <span>${item.timestamp || 'Live'}</span>
                    </div>
                `;
                container.appendChild(card);
            });

            const indicator = document.getElementById('load-more-indicator');
            if (displayedCount < currentFiltered.length) {
                indicator.classList.remove('hidden');
            } else {
                indicator.classList.add('hidden');
            }
        }

        window.addEventListener('scroll', () => {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
                if (displayedCount < currentFiltered.length) {
                    displayedCount += 6;
                    renderCards();
                }
            }
        });

        function filterDiscoveries() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            currentFiltered = allDiscoveries.filter(item => {
                return (item.name && item.name.toLowerCase().includes(query)) ||
                       (item.target_protein && item.target_protein.toLowerCase().includes(query)) ||
                       (item.indication && item.indication.toLowerCase().includes(query));
            });
            displayedCount = 6;
            renderCards();
        }

        function openThetaModal() {
            document.getElementById('thetaModal').classList.remove('hidden');
            document.getElementById('thetaInput').focus();
        }

        function closeThetaModal() {
            document.getElementById('thetaModal').classList.add('hidden');
        }

        function executeThetaSynthesis() {
            const val = document.getElementById('thetaInput').value.trim();
            if(!val) { alert("Please enter a valid theta value."); return; }

            const newCompound = {
                name: `Vyom-Cosmic-Theta-${val}`,
                type: "Vyom Dynamic Theta Synthesis",
                resonance: "100.0%",
                target_protein: `Harmonic Receptor Target (Theta: ${val} rad)`,
                indication: `Targeted cellular modulation via Theta phase angle ${val}.`,
                mechanism: `Synthesized on-the-fly using sine-wave universality equations (${val} rad).`,
                mw: (320 + parseFloat(val || 0.1) * 150).toFixed(2),
                logp: (2.1 + parseFloat(val || 0.1)).toFixed(2),
                binding_affinity: (-10.2 - parseFloat(val || 0.1) * 1.5).toFixed(2) + " kcal/mol",
                phase: `${val} rad`,
                sa_score: "10.0/10",
                mode: "Browser Persistent Engine",
                timestamp: new Date().toISOString().replace('T', ' ').substring(0, 19)
            };

            allDiscoveries.unshift(newCompound);
            saveToLocalStorage();
            currentFiltered = allDiscoveries;
            displayedCount = 6;
            renderCards();

            const summaryEl = document.getElementById('theta-result-summary');
            summaryEl.innerText = `✓ Saved locally: ${newCompound.name}`;
            summaryEl.classList.remove('hidden');
            setTimeout(() => { closeThetaModal(); summaryEl.classList.add('hidden'); document.getElementById('thetaInput').value = ''; }, 1500);
        }

        // Auto-synthesis daemon capped at 50 compounds over 5 mins
        let autoGeneratedCount = 0;
        const autoSynthInterval = setInterval(() => {
            if (autoGeneratedCount >= 50) {
                clearInterval(autoSynthInterval);
                return;
            }
            const randomTheta = (Math.random() * 2.8).toFixed(4);
            const autoCompound = {
                name: `Vyom-Browser-Auto-${Math.floor(Math.random() * 89999 + 10000)}`,
                type: "Autonomous Browser AI",
                resonance: (99.5 + Math.random() * 0.5).toFixed(1) + "%",
                target_protein: `Auto-Target Receptor Alpha-${autoGeneratedCount + 1}`,
                indication: `Autonomous biological target modulation via theta phase ${randomTheta}.`,
                mechanism: `Synthesized automatically by browser background daemon.`,
                mw: (300 + Math.random() * 300).toFixed(2),
                logp: (1.0 + Math.random() * 2.5).toFixed(2),
                binding_affinity: (-10.0 - Math.random() * 2.0).toFixed(2) + " kcal/mol",
                phase: `${randomTheta} rad`,
                sa_score: "10.0/10",
                mode: "Browser Daemon",
                timestamp: new Date().toISOString().replace('T', ' ').substring(0, 19)
            };

            allDiscoveries.unshift(autoCompound);
            saveToLocalStorage();
            if (!document.getElementById('searchInput').value) {
                currentFiltered = allDiscoveries;
                renderCards();
            }
            document.getElementById('record-count').innerText = `${allDiscoveries.length} Records (Saved)`;
            autoGeneratedCount++;
        }, 6000);

        loadDiscoveries();
    </script>
</body>
</html>
