<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vyom Sutra | Autonomous Drug Discovery Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: #38bdf8; margin-bottom: 5px; }
        p { color: #94a3b8; }
        .stats { display: flex; justify-content: space-around; background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .stat-box { text-align: center; }
        .stat-box h3 { margin: 0; color: #38bdf8; font-size: 24px; }
        .stat-box span { color: #94a3b8; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #334155; }
        th { background: #334155; color: #38bdf8; text-transform: uppercase; font-size: 12px; letter-spacing: 0.05em; }
        tr:hover { background: #273548; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .hit { background: #065f46; color: #34d399; }
        .moderate { background: #78350f; color: #fbbf24; }
        .noise { background: #7f1d1d; color: #f87171; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Vyom Sutra Discovery Engine</h1>
            <p>Deterministic $O(1)$ Molecular Affinity & Target Resonance Live Feed</p>
        </header>

        <div class="stats">
            <div class="stat-box">
                <h3 id="total-count">0</h3>
                <span>Total Discoveries</span>
            </div>
            <div class="stat-box">
                <h3 id="top-resonance">0%</h3>
                <span>Max Resonance Score</span>
            </div>
            <div class="stat-box">
                <h3 id="last-update">Never</h3>
                <span>Last Sync Time</span>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Timestamp</th>
                    <th>Compound Name</th>
                    <th>PubChem ID</th>
                    <th>Phase Angle</th>
                    <th>Noise ($C_{\mu\nu}$)</th>
                    <th>Resonance Alignment</th>
                    <th>Status</th>
                </tr>
            v>
            <tbody id="discovery-table">
                <tr><td colspan="7" style="text-align: center;">Loading discoveries...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        async function loadDiscoveries() {
            try {
                const response = await fetch('discoveries.json?t=' + new Date().getTime());
                const data = await response.json();
                
                document.getElementById('total-count').innerText = data.length;
                if(data.length > 0) {
                    document.getElementById('top-resonance').innerText = data[0].affinity_score + '%';
                    document.getElementById('last-update').innerText = data[0].timestamp;
                }

                const tbody = document.getElementById('discovery-table');
                tbody.innerHTML = '';

                data.forEach(item => {
                    let badgeClass = 'noise';
                    if(item.status === 'Clean Target Hit') badgeClass = 'hit';
                    else if(item.status === 'Moderate Hit') badgeClass = 'moderate';

                    const row = `<tr>
                        <td>${item.timestamp}</td>
                        <td><strong>${item.name}</strong></td>
                        <td>${item.id}</td>
                        <td>${item.phase_angle} rad</td>
                        <td>${item.c_mu_nu}</td>
                        <td><strong>${item.affinity_score}%</strong></td>
                        <td><span class="badge ${badgeClass}">${item.status}</span></td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
            } catch (err) {
                console.error('Error loading discoveries:', err);
            }
        }

        loadDiscoveries();
        setInterval(loadDiscoveries, 5000); // हरेक ५ सेकेन्डमा फ्रन्टइन्ड अटो-रफ्रेस हुन्छ
    </script>
</body>
</html>
